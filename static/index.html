<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат с внешним API</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
        }
        #sidebar {
            width: 280px;
            background-color: #fff;
            border-right: 1px solid #e0e0e0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }
        #sidebar h2 {
            margin: 0 0 8px;
            font-size: 16px;
            color: #2c3e50;
        }
        .tool-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tool-group label {
            font-size: 13px;
            color: #555;
            font-weight: 500;
        }
        .tool-group select,
        .tool-group input {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .tool-group select:focus,
        .tool-group input:focus {
            border-color: #007bff;
        }
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 16px 24px;
            text-align: center;
            font-size: 18px;
            font-weight: 500;
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .exchange {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .user-message {
            align-self: flex-end;
            background-color: #007bff;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .api-message {
            align-self: flex-start;
            background-color: #fff;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .error-message {
            align-self: flex-start;
            background-color: #fff5f5;
            color: #c53030;
            border: 1px solid #feb2b2;
            border-bottom-left-radius: 4px;
        }
        .meta {
            font-size: 11px;
            color: #888;
            margin: 0 4px;
        }
        .message-info {
            font-size: 11px;
            color: #666;
            background-color: #f0f0f0;
            padding: 4px 8px;
            border-radius: 12px;
            margin: 4px 4px 0;
            font-family: monospace;
        }
        #input-area {
            background-color: #fff;
            border-top: 1px solid #e0e0e0;
            padding: 16px 24px;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        #message-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
        }
        #message-input:focus {
            border-color: #007bff;
        }
        #send-button {
            padding: 12px 24px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #send-button:hover:not(:disabled) {
            background-color: #0056b3;
        }
        #send-button:disabled {
            background-color: #9ec5fe;
            cursor: not-allowed;
        }
        #clear-history {
            padding: 10px 16px;
            background-color: #dc3545;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #clear-history:hover {
            background-color: #a71d2a;
        }
        .empty-state {
            color: #888;
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <aside id="sidebar">
        <h2>Настройки</h2>

        <div class="tool-group">
            <label for="role">Роль</label>
            <select id="role">
                <option value="">—</option>
                <option value="analyst">Аналитик</option>
                <option value="developer">Разработчик</option>
                <option value="tester">Тестировщик</option>
            </select>
        </div>

        <div class="tool-group">
            <label for="response-format">Формат ответа</label>
            <select id="response-format">
                <option value="text">text</option>
                <option value="json">json</option>
            </select>
        </div>

        <div class="tool-group">
            <label for="temperature">Температура</label>
            <input type="number" id="temperature" placeholder="Например, 0.7" min="0" max="2" step="0.1">
        </div>

        <div class="tool-group">
            <label for="max-tokens">Ограничение по длине ответа</label>
            <input type="number" id="max-tokens" placeholder="Например, 500" min="1">
        </div>

        <div class="tool-group">
            <label for="stop-sequence">Условие завершения ответа</label>
            <input type="text" id="stop-sequence" placeholder="Стоп-последовательность">
        </div>

        <div class="tool-group">
            <button type="button" id="clear-history">Очистить историю</button>
        </div>
    </aside>

    <div id="main">
        <header>Чат с внешним API</header>
        <div id="chat">
            <div class="empty-state">Введите сообщение, чтобы начать диалог</div>
        </div>
        <form id="input-area">
            <input type="text" id="message-input" placeholder="Введите сообщение..." autocomplete="off" autofocus>
            <button type="submit" id="send-button">Отправить</button>
        </form>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const form = document.getElementById('input-area');
        const input = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const role = document.getElementById('role');
        const responseFormat = document.getElementById('response-format');
        const temperature = document.getElementById('temperature');
        const maxTokens = document.getElementById('max-tokens');
        const stopSequence = document.getElementById('stop-sequence');
        const clearHistoryButton = document.getElementById('clear-history');

        // Генерируем или восстанавливаем идентификатор сессии.
        let sessionId = localStorage.getItem('chat_session_id');
        if (!sessionId) {
            sessionId = 'sess_' + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('chat_session_id', sessionId);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = input.value.trim();
            if (!message) return;

            input.value = '';
            setLoading(true);

            const exchange = document.createElement('div');
            exchange.className = 'exchange';

            const userMessage = createMessage(message, 'user-message');
            exchange.appendChild(userMessage);
            chat.appendChild(exchange);

            removeEmptyState();
            scrollToBottom();

            const payload = {
                message: message,
                role: role.value || null,
                response_format: responseFormat.value,
                session_id: sessionId,
                temperature: parseFloat(temperature.value) || null,
                max_tokens: parseInt(maxTokens.value, 10) || null,
                stop_sequence: stopSequence.value.trim() || null
            };

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    const errorMessage = createMessage(data.error || 'Неизвестная ошибка', 'error-message');
                    exchange.appendChild(errorMessage);
                } else {
                    const apiMessage = createMessage(data.response || '(пустой ответ)', 'api-message', data.finish_reason, {
                        durationMs: data.duration_ms,
                        promptTokens: data.prompt_tokens,
                        completionTokens: data.completion_tokens,
                        totalTokens: data.total_tokens
                    });
                    exchange.appendChild(apiMessage);
                }
            } catch (err) {
                const errorMessage = createMessage('Ошибка сети: ' + err.message, 'error-message');
                exchange.appendChild(errorMessage);
            } finally {
                setLoading(false);
                scrollToBottom();
            }
        });

        function createMessage(text, className, finishReason = null, stats = null) {
            const wrapper = document.createElement('div');
            wrapper.style.display = 'flex';
            wrapper.style.flexDirection = 'column';
            wrapper.style.alignItems = className === 'user-message' ? 'flex-end' : 'flex-start';

            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = className === 'user-message' ? 'Вы' : 'API';

            const bubble = document.createElement('div');
            bubble.className = 'message ' + className;
            bubble.textContent = text;

            wrapper.appendChild(meta);
            wrapper.appendChild(bubble);

            if (finishReason || stats) {
                const infoRow = document.createElement('div');
                infoRow.className = 'message-info';

                const parts = [];
                if (finishReason) {
                    parts.push('finish: ' + finishReason);
                }
                if (stats && stats.durationMs) {
                    parts.push('время: ' + stats.durationMs + ' мс');
                }
                if (stats && stats.totalTokens) {
                    parts.push('токены: ' + stats.totalTokens + ' (' + stats.promptTokens + ' + ' + stats.completionTokens + ')');
                }

                infoRow.textContent = parts.join(' • ');
                wrapper.appendChild(infoRow);
            }

            return wrapper;
        }

        clearHistoryButton.addEventListener('click', async () => {
            try {
                const response = await fetch('/api/chat/clear', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });

                if (!response.ok) {
                    const data = await response.json();
                    alert('Ошибка очистки истории: ' + (data.error || 'Неизвестная ошибка'));
                    return;
                }

                // Генерируем новый session_id и очищаем чат.
                sessionId = 'sess_' + Math.random().toString(36).substring(2, 15);
                localStorage.setItem('chat_session_id', sessionId);
                chat.innerHTML = '<div class="empty-state">Введите сообщение, чтобы начать диалог</div>';
            } catch (err) {
                alert('Ошибка сети: ' + err.message);
            }
        });

        function setLoading(loading) {
            sendButton.disabled = loading;
            sendButton.textContent = loading ? 'Отправка...' : 'Отправить';
            input.disabled = loading;
        }

        function removeEmptyState() {
            const empty = chat.querySelector('.empty-state');
            if (empty) empty.remove();
        }

        function scrollToBottom() {
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
