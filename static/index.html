<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат с внешним API</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
        }
        #sidebar {
            width: 280px;
            background-color: #fff;
            border-right: 1px solid #e0e0e0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }
        #sidebar h2 {
            margin: 0 0 8px;
            font-size: 16px;
            color: #2c3e50;
        }
        .tool-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tool-group label {
            font-size: 13px;
            color: #555;
            font-weight: 500;
        }
        .tool-group select,
        .tool-group input {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .tool-group select:focus,
        .tool-group input:focus {
            border-color: #007bff;
        }
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 16px 24px;
            text-align: center;
            font-size: 18px;
            font-weight: 500;
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .exchange {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .user-message {
            align-self: flex-end;
            background-color: #007bff;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .api-message {
            align-self: flex-start;
            background-color: #fff;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .error-message {
            align-self: flex-start;
            background-color: #fff5f5;
            color: #c53030;
            border: 1px solid #feb2b2;
            border-bottom-left-radius: 4px;
        }
        .meta {
            font-size: 11px;
            color: #888;
            margin: 0 4px;
        }
        .message-info {
            font-size: 11px;
            color: #666;
            background-color: #f0f0f0;
            padding: 4px 8px;
            border-radius: 12px;
            margin: 4px 4px 0;
            font-family: monospace;
        }
        #input-area {
            background-color: #fff;
            border-top: 1px solid #e0e0e0;
            padding: 16px 24px;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        #message-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
        }
        #message-input:focus {
            border-color: #007bff;
        }
        #send-button {
            padding: 12px 24px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #send-button:hover:not(:disabled) {
            background-color: #0056b3;
        }
        #send-button:disabled {
            background-color: #9ec5fe;
            cursor: not-allowed;
        }
        #clear-history {
            padding: 10px 16px;
            background-color: #dc3545;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #clear-history:hover {
            background-color: #a71d2a;
        }
        .empty-state {
            color: #888;
            text-align: center;
            margin-top: 40px;
        }
        .hidden {
            display: none;
        }
        .facts-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .fact-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            background-color: #f8f9fa;
            padding: 6px 8px;
            border-radius: 6px;
        }
        .fact-item button {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            font-size: 12px;
        }
        .facts-inputs {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .facts-inputs input {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
        }
        .facts-inputs button {
            padding: 8px 10px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .branch-inputs {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .branch-inputs input {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
        }
        .branch-inputs button {
            padding: 8px 10px;
            background-color: #28a745;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <aside id="sidebar">
        <h2>Настройки</h2>

        <div class="tool-group">
            <label for="role">Роль</label>
            <select id="role">
                <option value="">—</option>
                <option value="analyst">Аналитик</option>
                <option value="developer">Разработчик</option>
                <option value="tester">Тестировщик</option>
            </select>
        </div>

        <div class="tool-group">
            <label for="response-format">Формат ответа</label>
            <select id="response-format">
                <option value="text">text</option>
                <option value="json">json</option>
            </select>
        </div>

        <div class="tool-group">
            <label for="temperature">Температура</label>
            <input type="number" id="temperature" placeholder="Например, 0.7" min="0" max="2" step="0.1">
        </div>

        <div class="tool-group">
            <label for="max-tokens">Ограничение по длине ответа</label>
            <input type="number" id="max-tokens" placeholder="Например, 500" min="1">
        </div>

        <div class="tool-group">
            <label for="stop-sequence">Условие завершения ответа</label>
            <input type="text" id="stop-sequence" placeholder="Стоп-последовательность">
        </div>

        <div class="tool-group">
            <label for="context-strategy">Стратегия контекста</label>
            <select id="context-strategy">
                <option value="full">Полная история</option>
                <option value="summary">Summary (2 + summary)</option>
                <option value="sliding_window">Sliding Window (10)</option>
                <option value="facts">Facts / Key-Value</option>
                <option value="branching">Ветки диалога</option>
            </select>
        </div>

        <div id="facts-panel" class="tool-group hidden">
            <label>Facts</label>
            <div id="facts-list" class="facts-list"></div>
            <div class="facts-inputs">
                <input type="text" id="fact-key" placeholder="Ключ">
                <input type="text" id="fact-value" placeholder="Значение">
                <button type="button" id="add-fact">Добавить</button>
            </div>
        </div>

        <div id="branches-panel" class="tool-group hidden">
            <label for="branch-select">Активная ветка</label>
            <select id="branch-select"></select>
            <div class="branch-inputs">
                <input type="text" id="new-branch-name" placeholder="Имя новой ветки">
                <button type="button" id="create-branch">Создать ветку</button>
            </div>
        </div>

        <div class="tool-group">
            <button type="button" id="clear-history">Очистить историю</button>
        </div>
    </aside>

    <div id="main">
        <header>Чат с внешним API</header>
        <div id="chat">
            <div class="empty-state">Введите сообщение, чтобы начать диалог</div>
        </div>
        <form id="input-area">
            <input type="text" id="message-input" placeholder="Введите сообщение..." autocomplete="off" autofocus>
            <button type="submit" id="send-button">Отправить</button>
        </form>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const form = document.getElementById('input-area');
        const input = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const role = document.getElementById('role');
        const responseFormat = document.getElementById('response-format');
        const temperature = document.getElementById('temperature');
        const maxTokens = document.getElementById('max-tokens');
        const stopSequence = document.getElementById('stop-sequence');
        const contextStrategy = document.getElementById('context-strategy');
        const factsPanel = document.getElementById('facts-panel');
        const factsList = document.getElementById('facts-list');
        const factKey = document.getElementById('fact-key');
        const factValue = document.getElementById('fact-value');
        const addFactButton = document.getElementById('add-fact');
        const branchesPanel = document.getElementById('branches-panel');
        const branchSelect = document.getElementById('branch-select');
        const newBranchName = document.getElementById('new-branch-name');
        const createBranchButton = document.getElementById('create-branch');
        const clearHistoryButton = document.getElementById('clear-history');

        let facts = {};

        // Генерируем или восстанавливаем идентификатор сессии.
        let sessionId = localStorage.getItem('chat_session_id');
        if (!sessionId) {
            sessionId = 'sess_' + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('chat_session_id', sessionId);
        }

        // Восстанавливаем стратегию контекста.
        const savedStrategy = localStorage.getItem('context_strategy');
        if (savedStrategy) {
            contextStrategy.value = savedStrategy;
        }
        updateStrategyUI();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = input.value.trim();
            if (!message) return;

            input.value = '';
            setLoading(true);

            const exchange = document.createElement('div');
            exchange.className = 'exchange';

            const userMessage = createMessage(message, 'user-message');
            exchange.appendChild(userMessage);
            chat.appendChild(exchange);

            removeEmptyState();
            scrollToBottom();

            const payload = {
                message: message,
                role: role.value || null,
                response_format: responseFormat.value,
                session_id: sessionId,
                context_strategy: contextStrategy.value,
                facts: facts,
                temperature: parseFloat(temperature.value) || null,
                max_tokens: parseInt(maxTokens.value, 10) || null,
                stop_sequence: stopSequence.value.trim() || null
            };

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    const errorMessage = createMessage(data.error || 'Неизвестная ошибка', 'error-message');
                    exchange.appendChild(errorMessage);
                } else {
                    const apiMessage = createMessage(data.response || '(пустой ответ)', 'api-message', data.finish_reason, {
                        durationMs: data.duration_ms,
                        promptTokens: data.prompt_tokens,
                        completionTokens: data.completion_tokens,
                        totalTokens: data.total_tokens,
                        sessionTotalTokens: data.session_total_tokens
                    });
                    exchange.appendChild(apiMessage);

                    updateStateFromResponse(data);
                }
            } catch (err) {
                const errorMessage = createMessage('Ошибка сети: ' + err.message, 'error-message');
                exchange.appendChild(errorMessage);
            } finally {
                setLoading(false);
                scrollToBottom();
            }
        });

        function createMessage(text, className, finishReason = null, stats = null) {
            const wrapper = document.createElement('div');
            wrapper.style.display = 'flex';
            wrapper.style.flexDirection = 'column';
            wrapper.style.alignItems = className === 'user-message' ? 'flex-end' : 'flex-start';

            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = className === 'user-message' ? 'Вы' : 'API';

            const bubble = document.createElement('div');
            bubble.className = 'message ' + className;
            bubble.textContent = text;

            wrapper.appendChild(meta);
            wrapper.appendChild(bubble);

            if (finishReason || stats) {
                const infoRow = document.createElement('div');
                infoRow.className = 'message-info';

                const parts = [];
                if (finishReason) {
                    parts.push('finish: ' + finishReason);
                }
                if (stats && stats.durationMs) {
                    parts.push('время: ' + stats.durationMs + ' мс');
                }
                if (stats && stats.totalTokens) {
                    parts.push('токены: ' + stats.totalTokens + ' (' + stats.promptTokens + ' + ' + stats.completionTokens + ')');
                }
                if (stats && stats.sessionTotalTokens) {
                    parts.push('всего за диалог: ' + stats.sessionTotalTokens);
                }

                infoRow.textContent = parts.join(' • ');
                wrapper.appendChild(infoRow);
            }

            return wrapper;
        }

        clearHistoryButton.addEventListener('click', async () => {
            try {
                const response = await fetch('/api/chat/clear', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });

                if (!response.ok) {
                    const data = await response.json();
                    alert('Ошибка очистки истории: ' + (data.error || 'Неизвестная ошибка'));
                    return;
                }

                // Генерируем новый session_id, сбрасываем состояние и очищаем чат.
                sessionId = 'sess_' + Math.random().toString(36).substring(2, 15);
                localStorage.setItem('chat_session_id', sessionId);
                localStorage.removeItem('context_strategy');
                facts = {};
                contextStrategy.value = 'full';
                updateStrategyUI();
                chat.innerHTML = '<div class="empty-state">Введите сообщение, чтобы начать диалог</div>';
            } catch (err) {
                alert('Ошибка сети: ' + err.message);
            }
        });

        contextStrategy.addEventListener('change', async () => {
            localStorage.setItem('context_strategy', contextStrategy.value);
            updateStrategyUI();
            try {
                const response = await fetch('/api/session/facts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, context_strategy: contextStrategy.value, facts: facts })
                });
                const data = await response.json();
                if (response.ok) updateStateFromResponse(data);
            } catch (err) {
                console.error('Ошибка смены стратегии:', err);
            }
        });

        function updateStrategyUI() {
            const strategy = contextStrategy.value;
            factsPanel.classList.toggle('hidden', strategy !== 'facts');
            branchesPanel.classList.toggle('hidden', strategy !== 'branching');
        }

        function renderFacts() {
            factsList.innerHTML = '';
            for (const [key, value] of Object.entries(facts)) {
                const item = document.createElement('div');
                item.className = 'fact-item';
                item.innerHTML = `<span><strong>${escapeHtml(key)}:</strong> ${escapeHtml(value)}</span> <button type="button" data-key="${escapeHtml(key)}">×</button>`;
                factsList.appendChild(item);
            }
            factsList.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => deleteFact(btn.dataset.key));
            });
        }

        addFactButton.addEventListener('click', () => {
            const key = factKey.value.trim();
            const value = factValue.value.trim();
            if (!key) return;
            facts[key] = value;
            factKey.value = '';
            factValue.value = '';
            updateFactsOnServer();
        });

        async function deleteFact(key) {
            delete facts[key];
            await updateFactsOnServer();
        }

        async function updateFactsOnServer() {
            try {
                const response = await fetch('/api/session/facts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, context_strategy: contextStrategy.value, facts: facts })
                });
                const data = await response.json();
                if (response.ok) updateStateFromResponse(data);
            } catch (err) {
                console.error('Ошибка обновления facts:', err);
            }
        }

        function renderBranches(branches, active) {
            branchSelect.innerHTML = '';
            for (const name of branches || []) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                if (name === active) option.selected = true;
                branchSelect.appendChild(option);
            }
        }

        branchSelect.addEventListener('change', async () => {
            try {
                const response = await fetch('/api/session/branches', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, branch_action: `switch:${branchSelect.value}` })
                });
                const data = await response.json();
                if (response.ok) updateStateFromResponse(data);
            } catch (err) {
                console.error('Ошибка переключения ветки:', err);
            }
        });

        createBranchButton.addEventListener('click', async () => {
            const name = newBranchName.value.trim();
            if (!name) return;
            try {
                const response = await fetch('/api/session/branches', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, branch_action: `create:${name}` })
                });
                const data = await response.json();
                if (response.ok) {
                    updateStateFromResponse(data);
                    newBranchName.value = '';
                } else {
                    alert(data.error || 'Ошибка создания ветки');
                }
            } catch (err) {
                console.error('Ошибка создания ветки:', err);
            }
        });

        function updateStateFromResponse(data) {
            if (data.active_branch) {
                renderBranches(data.branches, data.active_branch);
            }
            if (data.facts) {
                facts = data.facts;
                renderFacts();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function setLoading(loading) {
            sendButton.disabled = loading;
            sendButton.textContent = loading ? 'Отправка...' : 'Отправить';
            input.disabled = loading;
        }

        function removeEmptyState() {
            const empty = chat.querySelector('.empty-state');
            if (empty) empty.remove();
        }

        function scrollToBottom() {
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
