<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат с внешним API</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 16px 24px;
            text-align: center;
            font-size: 18px;
            font-weight: 500;
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .exchange {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .user-message {
            align-self: flex-end;
            background-color: #007bff;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .api-message {
            align-self: flex-start;
            background-color: #fff;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .error-message {
            align-self: flex-start;
            background-color: #fff5f5;
            color: #c53030;
            border: 1px solid #feb2b2;
            border-bottom-left-radius: 4px;
        }
        .meta {
            font-size: 11px;
            color: #888;
            margin: 0 4px;
        }
        #input-area {
            background-color: #fff;
            border-top: 1px solid #e0e0e0;
            padding: 16px 24px;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        #message-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
        }
        #message-input:focus {
            border-color: #007bff;
        }
        #send-button {
            padding: 12px 24px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #send-button:hover:not(:disabled) {
            background-color: #0056b3;
        }
        #send-button:disabled {
            background-color: #9ec5fe;
            cursor: not-allowed;
        }
        .empty-state {
            color: #888;
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header>Чат с внешним API</header>
    <div id="chat">
        <div class="empty-state">Введите сообщение, чтобы начать диалог</div>
    </div>
    <form id="input-area">
        <input type="text" id="message-input" placeholder="Введите сообщение..." autocomplete="off" autofocus>
        <button type="submit" id="send-button">Отправить</button>
    </form>

    <script>
        const chat = document.getElementById('chat');
        const form = document.getElementById('input-area');
        const input = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = input.value.trim();
            if (!message) return;

            input.value = '';
            setLoading(true);

            const exchange = document.createElement('div');
            exchange.className = 'exchange';

            const userMessage = createMessage(message, 'user-message');
            exchange.appendChild(userMessage);
            chat.appendChild(exchange);

            removeEmptyState();
            scrollToBottom();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    const errorMessage = createMessage(data.error || 'Неизвестная ошибка', 'error-message');
                    exchange.appendChild(errorMessage);
                } else {
                    const apiMessage = createMessage(data.response || '(пустой ответ)', 'api-message');
                    exchange.appendChild(apiMessage);
                }
            } catch (err) {
                const errorMessage = createMessage('Ошибка сети: ' + err.message, 'error-message');
                exchange.appendChild(errorMessage);
            } finally {
                setLoading(false);
                scrollToBottom();
            }
        });

        function createMessage(text, className) {
            const wrapper = document.createElement('div');
            wrapper.style.display = 'flex';
            wrapper.style.flexDirection = 'column';
            wrapper.style.alignItems = className === 'user-message' ? 'flex-end' : 'flex-start';

            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = className === 'user-message' ? 'Вы' : 'API';

            const bubble = document.createElement('div');
            bubble.className = 'message ' + className;
            bubble.textContent = text;

            wrapper.appendChild(meta);
            wrapper.appendChild(bubble);
            return wrapper;
        }

        function setLoading(loading) {
            sendButton.disabled = loading;
            sendButton.textContent = loading ? 'Отправка...' : 'Отправить';
            input.disabled = loading;
        }

        function removeEmptyState() {
            const empty = chat.querySelector('.empty-state');
            if (empty) empty.remove();
        }

        function scrollToBottom() {
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
