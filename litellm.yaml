# Конфигурация LiteLLM-прокси как единого OpenAI-совместимого шлюза.
# Секреты (master key, database_url) берутся из переменных окружения,
# которые экспортирует run-litellm.sh из .env.secrets.

model_list:
  # Chat: локальная Ollama. ollama_chat/ = эндпоинт /api/chat (поддерживает tools).
  - model_name: chat
    litellm_params:
      model: ollama_chat/qwen2.5:7b
      api_base: http://localhost:11434

  # Embeddings: локальная Ollama (/api/embed).
  - model_name: embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://localhost:11434
    model_info:
      mode: embedding

  # --- Пример: корпоративный OpenAI-совместимый провайдер (закомментировано) ---
  # Для использования раскомментируйте и задайте CORP_API_KEY в .env.secrets,
  # затем добавьте "corp-chat" в список models виртуальных ключей (provision-keys.sh).
  # - model_name: corp-chat
  #   litellm_params:
  #     model: openai/SMLab-ext/DeepSeek-V4.1-Flash
  #     api_base: https://api.ai.localcorp.net/v1
  #     api_key: os.environ/CORP_API_KEY

litellm_settings:
  drop_params: true          # не падать на неподдерживаемых параметрах (напр. tools)
  num_retries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
